<svg xmlns="http://www.w3.org/2000/svg" width="15" height="13" viewBox="0 0 15 13">
  <!-- Rounded modern speaker: softer shape, thinner waves -->
  <path d="M0.8,4.8 L0.8,8.2 L2.8,8.2 L5.8,11 L5.8,2 L2.8,4.8 Z" fill="white" stroke="white" stroke-width="0.3" stroke-linejoin="round"/>
  <!-- Inner wave -->
  <path d="M8.2,4.2 A2.8,2.8 0 0 1 8.2,8.8" fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Outer wave -->
  <path d="M10.6,2.2 A5,5 0 0 1 10.6,10.8" fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
</svg>
