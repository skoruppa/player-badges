<svg xmlns="http://www.w3.org/2000/svg" width="15" height="13" viewBox="0 0 15 13">
  <!-- AudioWaveBadgeIcon - exact from Kotlin diff code -->
  <!-- w=15, h=13, strokeWidth=h*0.13=1.69 clamped >=1.5 -->
  
  <!-- D-shaped speaker body (stroked outline) -->
  <!-- dRight=6.9, dTop=1.95, dBottom=11.05 -->
  <!-- rect for arc: (0.3, 1.95, 6.9, 11.05) → cx=3.6, cy=6.5, rx=3.3, ry=4.55 -->
  <path d="M1.2,1.95 L3.3,1.95 A3.3,4.55 0 0 1 3.3,11.05 L1.2,11.05 Z" 
        fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  
  <!-- Inner sound wave arc -->
  <!-- topLeft=(5.1, 3.12), size=(5.4, 6.76) → cx=7.8, cy=6.5, rx=2.7, ry=3.38 -->
  <!-- startAngle=-45°, sweep=90° (from upper-right to lower-right) -->
  <path d="M9.71,3.11 A2.7,3.38 0 0 1 9.71,9.89"
        fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  
  <!-- Outer sound wave arc -->
  <!-- topLeft=(7.2, 1.3), size=(6.9, 10.4) → cx=10.65, cy=6.5, rx=3.45, ry=5.2 -->
  <!-- startAngle=-48°, sweep=96° -->
  <path d="M13.0,2.63 A3.45,5.2 0 0 1 13.0,10.37"
        fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
</svg>
