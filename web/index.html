<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvio Badge Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h1 id="t-title">Nuvio Badge Editor</h1>
        <div style="display:flex;gap:10px">
          <a href="https://github.com/skoruppa/player-badges" target="_blank" title="GitHub" style="color:var(--text2);display:flex">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
          <a href="https://ko-fi.com/skoruppa" target="_blank" title="Buy me a coffee" style="color:var(--text2);display:flex">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.453-4.011 3.976-4.011 3.976s-.121.119-.31.023c-.076-.057-.108-.09-.108-.09-.443-.441-3.368-3.049-4.034-3.954-.709-.965-1.041-2.7-.091-3.71.951-1.01 3.005-1.086 4.363.407 0 0 1.565-1.782 3.468-.963 1.904.82 1.832 3.011.723 4.311zm6.173.478c-.928.116-1.682.028-1.682.028V7.284h1.77s1.971.551 1.971 2.638c0 1.913-.985 2.667-2.059 3.015z"/></svg>
          </a>
        </div>
      </div>
      <p id="t-sub">Drag groups and badges to reorder</p>
    </div>

    <div class="control-section">
      <h3 id="t-settings">Settings</h3>
      <div class="control-row">
        <label id="t-context">Context</label>
        <select id="context-select">
          <option value="player" selected>Player</option>
          <option value="source">Source</option>
        </select>
      </div>
      <div class="control-row">
        <label id="t-locale">Locale</label>
        <select id="locale-select"></select>
      </div>
    </div>

    <div class="control-section">
      <h3 id="t-style">Style</h3>
      <div class="style-pills" id="style-pills">
        <div class="pill active" data-value="bordered" id="pill-bordered">Bordered</div>
        <div class="pill" data-value="filled" id="pill-filled">Filled</div>
        <div class="pill" data-value="none" id="pill-none">None</div>
      </div>
      <div class="filled-options" id="filled-options">
        <div class="control-row">
          <label id="t-fill">Fill color</label>
          <input type="color" id="fill-color-picker" value="#000000">
          <input class="hex-input" id="fill-color-hex" value="#000000">
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="no-border-checkbox">
          <span id="t-noborder">No border</span>
        </label>
      </div>
    </div>

    <div class="groups-container" id="groups-container"></div>
  </div>

  <!-- Right column (preview + output, sticky on desktop) -->
  <div class="right-column">
    <!-- Preview -->
    <div class="preview-panel" id="preview-panel">
      <div class="preview-toggle" id="preview-toggle">
        <div class="preview-label" id="t-preview">Live Preview</div>
        <span class="preview-chevron">&#9660;</span>
      </div>
      <div class="preview-label desktop-only" id="t-preview-desktop">Live Preview</div>
      <div class="preview-row" id="preview">
        <span class="preview-empty" id="t-empty">Select badges to preview</span>
      </div>
    </div>

    <!-- Output -->
    <div class="output-panel">
      <div class="output-section">
        <h2 id="t-url">Badge URL</h2>
        <div class="url-row">
          <input class="url-input" id="url-output" readonly>
          <button class="btn" id="btn-copy-url">Copy URL</button>
        </div>
      </div>
      <div class="output-section">
        <h2>JSON</h2>
        <div class="btn-row">
          <button class="btn btn-small" id="btn-copy-json">Copy JSON</button>
          <button class="btn btn-small btn-ghost" id="btn-toggle-json">Show/Hide</button>
        </div>
        <div class="json-box hidden" id="json-output"></div>
      </div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
