<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvio Badge Editor</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h1 id="t-title">Nuvio Badge Editor</h1>
        <div style="display:flex;gap:10px">
          <a href="https://github.com/skoruppa/player-badges" target="_blank" title="GitHub" style="color:var(--text2);display:flex">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
          <a href="https://ko-fi.com/skoruppa" target="_blank" title="Buy me a coffee" style="color:var(--text2);display:flex">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.453-4.011 3.976-4.011 3.976s-.121.119-.31.023c-.076-.057-.108-.09-.108-.09-.443-.441-3.368-3.049-4.034-3.954-.709-.965-1.041-2.7-.091-3.71.951-1.01 3.005-1.086 4.363.407 0 0 1.565-1.782 3.468-.963 1.904.82 1.832 3.011.723 4.311zm6.173.478c-.928.116-1.682.028-1.682.028V7.284h1.77s1.971.551 1.971 2.638c0 1.913-.985 2.667-2.059 3.015z"/></svg>
          </a>
        </div>
      </div>
      <p id="t-sub">Drag groups and badges to reorder</p>
    </div>

    <div class="control-section">
      <h3 id="t-settings">Settings</h3>
      <div class="control-row">
        <label id="t-context">Context</label>
      </div>
      <div class="context-cards" id="context-cards">
        <div class="context-card active" data-value="player" title="Player">
          <svg viewBox="0 0 160 90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Player skeleton: dark bg, title, badge row, progress bar -->
            <rect width="160" height="90" rx="4" fill="#111"/>
            <!-- play button center -->
            <circle cx="80" cy="36" r="10" stroke="#555" stroke-width="1.5" fill="none"/>
            <path d="M77 31 L85 36 L77 41Z" fill="#555"/>
            <!-- title -->
            <rect x="8" y="58" width="50" height="4" rx="1" fill="#444"/>
            <rect x="8" y="65" width="30" height="3" rx="1" fill="#333"/>
            <!-- badge chips -->
            <rect x="8" y="72" width="18" height="7" rx="2" stroke="#555" stroke-width="0.7" fill="none"/>
            <rect x="29" y="72" width="28" height="7" rx="2" stroke="#555" stroke-width="0.7" fill="none"/>
            <rect x="60" y="72" width="24" height="7" rx="2" stroke="#555" stroke-width="0.7" fill="none"/>
            <rect x="87" y="72" width="20" height="7" rx="2" stroke="#555" stroke-width="0.7" fill="none"/>
            <!-- progress bar -->
            <rect x="8" y="83" width="144" height="2" rx="1" fill="#333"/>
            <rect x="8" y="83" width="40" height="2" rx="1" fill="#4a9eff"/>
          </svg>
          <span>Player</span>
        </div>
        <div class="context-card" data-value="source" title="Source">
          <svg viewBox="0 0 160 90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Source list skeleton: rows with badges -->
            <rect width="160" height="90" rx="4" fill="#111"/>
            <!-- row 1 -->
            <rect x="8" y="6" width="144" height="24" rx="3" fill="#1a1a1a"/>
            <rect x="12" y="10" width="60" height="4" rx="1" fill="#444"/>
            <rect x="12" y="17" width="90" height="3" rx="1" fill="#333"/>
            <rect x="12" y="23" width="16" height="5" rx="1.5" stroke="#555" stroke-width="0.6" fill="none"/>
            <rect x="31" y="23" width="24" height="5" rx="1.5" stroke="#555" stroke-width="0.6" fill="none"/>
            <rect x="58" y="23" width="20" height="5" rx="1.5" stroke="#555" stroke-width="0.6" fill="none"/>
            <rect x="81" y="23" width="14" height="5" rx="1.5" stroke="#555" stroke-width="0.6" fill="none"/>
            <!-- row 2 -->
            <rect x="8" y="34" width="144" height="24" rx="3" fill="#1a1a1a"/>
            <rect x="12" y="38" width="55" height="4" rx="1" fill="#444"/>
            <rect x="12" y="45" width="80" height="3" rx="1" fill="#333"/>
            <rect x="12" y="51" width="16" height="5" rx="1.5" stroke="#555" stroke-width="0.6" fill="none"/>
            <rect x="31" y="51" width="24" height="5" rx="1.5" stroke="#555" stroke-width="0.6" fill="none"/>
            <rect x="58" y="51" width="20" height="5" rx="1.5" stroke="#555" stroke-width="0.6" fill="none"/>
            <!-- row 3 -->
            <rect x="8" y="62" width="144" height="24" rx="3" fill="#1a1a1a"/>
            <rect x="12" y="66" width="65" height="4" rx="1" fill="#444"/>
            <rect x="12" y="73" width="85" height="3" rx="1" fill="#333"/>
            <rect x="12" y="79" width="16" height="5" rx="1.5" stroke="#555" stroke-width="0.6" fill="none"/>
            <rect x="31" y="79" width="24" height="5" rx="1.5" stroke="#555" stroke-width="0.6" fill="none"/>
            <rect x="58" y="79" width="16" height="5" rx="1.5" stroke="#555" stroke-width="0.6" fill="none"/>
          </svg>
          <span>Source</span>
        </div>
      </div>
      <div class="control-row">
        <label id="t-locale">Locale</label>
        <select id="locale-select"></select>
      </div>
    </div>

    <div class="control-section">
      <h3 id="t-style">Style</h3>
      <div class="style-pills" id="style-pills">
        <div class="pill active" data-value="bordered" id="pill-bordered">Bordered</div>
        <div class="pill" data-value="filled" id="pill-filled">Filled</div>
        <div class="pill" data-value="none" id="pill-none">None</div>
      </div>
      <div class="filled-options" id="filled-options">
        <div class="control-row">
          <label id="t-fill">Fill color</label>
          <input type="color" id="fill-color-picker" value="#000000">
          <input class="hex-input" id="fill-color-hex" value="#000000">
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
          <span id="t-noborder" style="font-size:12px">No border</span>
          <label class="group-toggle">
            <input type="checkbox" id="no-border-checkbox">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="groups-container" id="groups-container"></div>
  </div>

  <!-- Right column (preview + output, sticky on desktop) -->
  <div class="right-column">
    <!-- Preview -->
    <div class="preview-panel" id="preview-panel">
      <div class="preview-toggle" id="preview-toggle">
        <div class="preview-label" id="t-preview">Live Preview</div>
        <span class="preview-chevron">&#9660;</span>
      </div>
      <div class="preview-label desktop-only" id="t-preview-desktop">Live Preview</div>
      <div class="preview-row" id="preview">
        <span class="preview-empty" id="t-empty">Select badges to preview</span>
      </div>
    </div>

    <!-- Output -->
    <div class="output-panel">
      <div class="output-section">
        <h2 id="t-url">Badge URL</h2>
        <div class="url-row">
          <input class="url-input" id="url-output" readonly>
          <button class="btn" id="btn-copy-url">Copy URL</button>
        </div>
      </div>
      <div class="output-section">
        <h2>JSON</h2>
        <div class="btn-row">
          <button class="btn btn-small" id="btn-copy-json">Copy JSON</button>
          <button class="btn btn-small btn-ghost" id="btn-toggle-json">Show/Hide</button>
        </div>
        <div class="json-box hidden" id="json-output"></div>
      </div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
